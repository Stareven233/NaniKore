# 此文件是可提交的运行配置模板：API Key 仅由 Windows DPAPI 保存到当前用户配置目录，不写入此文件。
# 修改根目录模板后重新构建；运行时在 Debug 或发布目录各自使用其副本。
version: 0.2.6+3
general:
  auto_translate: false
  target_language: 中文（简体）
pipeline:
  mode: local_ocr
  # mode: vision_oneshot
  active_profile: openai-dots
profiles:
- id: claude-ccs
  name: cc-switch-claude
  kind: claude
  base_url: http://localhost:15721
  model: auto-route-default
  supports_vision: true
  timeout_seconds: 30
- id: openai-nvidia
  name: nvidia
  kind: openai
  api_type: completions
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  supports_vision: true
  timeout_seconds: 30
- id: openai-agnes
  name: agnes
  kind: openai
  api_type: completions
  base_url: https://apihub.agnes-ai.com/v1
  model: agnes-2.5-flash
  supports_vision: true
  timeout_seconds: 30
- id: openai-dots
  name: dots
  kind: openai
  api_type: completions
  base_url: https://note3-prev-api.askdiandian.com/v1
  model: dots3-note-prev
  supports_vision: true
  timeout_seconds: 30
- id: gemini-hachimi
  name: 哈基米
  kind: gemini
  base_url: https://hachimi-2.stareven233.workers.dev
  model: gemini-3.5-flash
  supports_vision: true
  timeout_seconds: 30
- id: openai-default
  name: OpenAI 默认
  kind: openai
  api_type: completions
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  supports_vision: false
  timeout_seconds: 60
- id: claude-default
  name: Claude 默认
  kind: claude
  base_url: https://api.anthropic.com
  model: claude-haiku-4-5
  supports_vision: true
  timeout_seconds: 60
- id: gemini-default
  name: Gemini 默认
  kind: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-2.0-flash
  supports_vision: true
  timeout_seconds: 60
hotkeys:
  capture: Ctrl+Shift+A
  translate_clipboard: ''
windows:
  settings_width: 1024
  settings_height: 700
prompts:
  translate: Translate the supplied text into {{target_language}}. Return only the translation in {{target_language}}. Do not include explanations, notes, or source text.
  vision_oneshot: |
    Transcribe all readable text in the supplied image, then translate it into {{target_language}}.
    Return exactly this shape:
    <transcription>

    ---

    <translation>
    Do not include labels, markdown, commentary, or extra sections.
  explain: ''
