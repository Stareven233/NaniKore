# 此文件是可提交的运行配置模板：API Key 仅由 Windows DPAPI 保存到当前用户配置目录，不写入此文件。
# 修改根目录模板后重新构建；运行时在 Debug 或发布目录各自使用其副本。
version: 0.2.10+18
general:
  auto_translate: false
  target_language: 中文（简体）
pipeline:
  mode: local_ocr
  # mode: vision_oneshot
  active_profile: openai-dots
profiles:
- id: claude-ccs
  name: cc-switch-claude
  kind: claude
  base_url: http://localhost:15721
  model: auto-route-default
  supports_vision: true
  timeout_seconds: 30
- id: openai-nvidia
  name: nvidia
  kind: openai
  api_type: completions
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  supports_vision: true
  timeout_seconds: 30
- id: openai-agnes
  name: agnes
  kind: openai
  api_type: completions
  base_url: https://apihub.agnes-ai.com/v1
  model: agnes-2.5-flash
  supports_vision: true
  timeout_seconds: 30
- id: openai-dots
  name: dots
  kind: openai
  api_type: completions
  base_url: https://note3-prev-api.askdiandian.com/v1
  model: dots3-note-prev
  supports_vision: true
  timeout_seconds: 30
- id: gemini-hachimi
  name: 哈基米
  kind: gemini
  base_url: https://hachimi-2.stareven233.workers.dev
  model: gemini-3.5-flash
  supports_vision: true
  timeout_seconds: 30
- id: openai-default
  name: OpenAI 默认
  kind: openai
  api_type: completions
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  supports_vision: false
  timeout_seconds: 60
- id: claude-default
  name: Claude 默认
  kind: claude
  base_url: https://api.anthropic.com
  model: claude-haiku-4-5
  supports_vision: true
  timeout_seconds: 60
- id: gemini-default
  name: Gemini 默认
  kind: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-2.0-flash
  supports_vision: true
  timeout_seconds: 60
hotkeys:
  capture: Ctrl+Shift+A
  translate_clipboard: ''
windows:
  settings_width: 1024
  settings_height: 700
prompts:
  # base / japanese_plugin / english_plugin 留空即使用内置默认模板；此处仅显式声明视觉一条龙协议，
  # 内容与 PromptTemplates.DefaultVisionOneshotPrompt 保持一致，改协议时两边需同步。
  vision_oneshot: |
    你是准确、自然的视觉翻译引擎。
    先完整转录图片中可读的全部文字，再将其翻译为{{target_language}}，并按顺序输出恰好两部分：
    <annotated_source>
    ---TRANSLATION---
    <translation>
    第一部分是转录并完成注音标注的原文，第二部分是对应译文，两部分之间仅由 ---TRANSLATION--- 分隔。
    <annotated_source> 与 <translation> 是结构占位符，输出时替换为对应内容，尖括号本身不保留。
    原文中的日文汉字按 漢字[かな] 格式标注振假名，假名、标点、数字与非汉字单词不加方括号。
    忠实呈现图片中实际出现的内容，维持原有顺序与分行。
  explain: ''
